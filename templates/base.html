<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liverios Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-aFq/bzH65dt+w6FI2ooMVUpc+21e0SRygnTpmBvdBgSdnuTN7QbdgL+OapgHtvPp" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mozilla+Headline:wght@200..700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
         .pacifico-regular {
                           font-family: "Pacifico", cursive;
                           font-weight: 400;
                           font-style: normal;
         }


        .yanone-kaffeesatz-libe {
                            font-family: "Yanone Kaffeesatz", sans-serif;
                            font-optical-sizing: auto;
                            font-weight: 400;
                            font-style: normal;
        }
        .bi {
           vertical-align: -.125em;
           fill: currentColor
         }

    </style>
</head>

<body>

<header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom yanone-kaffeesatz-libe" style="background-color:#DAF5EE"><a href="/"
                                                                                   class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
    <svg class="bi me-2" width="40" height="32" aria-hidden="true">
        <use xlink:href="#bootstrap"></use>
    </svg>
    <span class="fs-4"><img
                        src="{{ url_for('static', filename='assets/images/command.svg') }}" height="28"> Liverios
                    Papagiannidis </span> </a>
    <ul class="nav nav-pills">
<!--        <li class="nav-item"><a href="#" class="nav-link active" aria-current="page">Home</a></li>-->
        <li class="nav-item"><a href="#" class="nav-link link-secondary">Projects</a></li>
        <li class="nav-item"><a href="{{ url_for('about') }}" class="nav-link link-secondary">About</a></li>
        <li class="nav-item"><a href="{{ url_for('contact') }}" class="nav-link link-secondary">Contact</a></li>
    </ul>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 mx-4 border-top">
    <div class="col-md-4 d-flex align-items-center"><a href="/"
                                                       class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1"
                                                       aria-label="Bootstrap">
        <svg class="bi"
             width="30" height="24" aria-hidden="true">
            <use xlink:href="#bootstrap"></use>
        </svg>
    </a> <span class="mb-3 mb-md-0 text-body-secondary">©Liverios Papagiannidis - 2025 </span></div>
    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
        <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Instagram"><img
                src="{{ url_for('static', filename='assets/images/instagram.svg') }}"></a></li>
        <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Facebook"><img
                src="{{ url_for('static', filename='assets/images/facebook.svg') }}"></a></li>
        <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Github"><img
                src="{{ url_for('static', filename='assets/images/github.svg') }}"></a></li>
        <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="LinkedIn"><img
                src="{{ url_for('static', filename='assets/images/linkedin.svg') }}"></a></li>
    </ul>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
