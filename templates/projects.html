{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3 sulphur-point-regular">
        {% for project in all_projects %}
        <div class="col">
            <div class="card shadow-sm">
                <img src="{{ project.img_url }}"
                     class="card-img-top"
                     alt="{{ project.title }}"
                     style="height: 200px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <h3 class="card-title">{{ project.title }}</h3>
                    <p class="card-text">{{ project.subtitle }}</p>
                                <div class="mt-auto">
              <a href="{{ url_for('show_project', project_id=project.id) }}" class="btn btn-sm btn-light">View</a>
            </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    </div>

{% endblock %}
